name: Scheduled scraper wake-up

on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-scraper-wakeup
  cancel-in-progress: false

jobs:
  wake-api:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wake the API and its catch-up scheduler
        run: |
          curl --fail --silent --show-error \
            --retry 8 --retry-delay 15 --retry-all-errors \
            --connect-timeout 20 --max-time 240 \
            https://carsale-1.onrender.com/health
      - name: Keep the API awake while the import starts
        run: |
          sleep 480
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --connect-timeout 20 --max-time 120 \
            https://carsale-1.onrender.com/health
